name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ai-task-platform-api
            dockerfile: infra/docker/api-server.Dockerfile
            context: .
          - image: ai-task-platform-web
            dockerfile: infra/docker/web.Dockerfile
            context: .
          - image: ai-task-platform-worker
            dockerfile: infra/docker/worker.Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

  update-manifests:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update image tags in K8s manifests
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s|image: .*/ai-task-platform-api:.*|image: ${{ secrets.DOCKER_USERNAME }}/ai-task-platform-api:${{ github.sha }}|g" infra/k8s/20-api-server.yaml
          sed -i "s|image: .*/ai-task-platform-worker:.*|image: ${{ secrets.DOCKER_USERNAME }}/ai-task-platform-worker:${{ github.sha }}|g" infra/k8s/30-worker.yaml
          sed -i "s|image: .*/ai-task-platform-web:.*|image: ${{ secrets.DOCKER_USERNAME }}/ai-task-platform-web:${{ github.sha }}|g" infra/k8s/40-web.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add infra/k8s/*.yaml
          git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
          git push

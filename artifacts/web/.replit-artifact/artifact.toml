kind = "web"
previewPath = "/"
title = "AI Task Platform"
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

# No [services.production] block: in production the api-server artifact
# serves the built SPA from a single Node process on port 8080. This avoids
# having multiple deployable ports, which Autoscale / Cloud Run forbids.

[services.env]
PORT = "22333"
BASE_PATH = "/"

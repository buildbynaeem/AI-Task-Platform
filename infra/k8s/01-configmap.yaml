apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-task-platform
  labels:
    app.kubernetes.io/part-of: ai-task-platform
data:
  # Standardized Ports
  PORT: "5000"
  WORKER_PORT: "8080"
  REDIS_URL: "redis://redis.ai-task-platform.svc.cluster.local:6379"
  BULL_QUEUE_NAME: "task-queue"
  MONGODB_DB_NAME: "taskplatform"
  NODE_ENV: "production"
  LOG_LEVEL: "info"

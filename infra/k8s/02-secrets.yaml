# Placeholder secret manifest. In production, populate via your secret-management
# system (Sealed Secrets, External Secrets, SOPS, Vault, cloud KMS, etc.)
# rather than committing real values.
#
# Required keys:
#   MONGODB_URI - MongoDB connection string (e.g. mongodb+srv://...)
#   JWT_SECRET  - Random 32+ byte string used to sign JWTs
#
# Example (one-liner) to create from real values:
#   kubectl create secret generic app-secrets \
#     --namespace ai-task-platform \
#     --from-literal=MONGODB_URI="mongodb+srv://user:pass@cluster.example.net/" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-task-platform
  labels:
    app.kubernetes.io/part-of: ai-task-platform
type: Opaque
stringData:
  MONGODB_URI: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
